llm:
  default_provider: openrouter
  default_model: qwen/qwen3.6-plus-preview:free
  max_retries: 3
  retry_backoff_jitter: true
  rate_limit_rps: 2
  rate_limit_burst: 10
  providers:
    ollama_cloud:
      base_url: https://cloud.ollama.com
      models:
        - glm4:cloud
        - llama3.3:cloud
        - qwen2.5:cloud
    openrouter:
      base_url: https://openrouter.ai/api/v1
      models:
        - qwen/qwen3.6-plus-preview:free
    groq:
      models:
        - llama-3.3-70b-versatile
        - mixtral-8x7b-32768
        - gemma2-9b-it
    ollama_local:
      base_url: http://localhost:11434
      models: []

rag:
  knowledge_base_pdf: knowledge/ai_ethics_knowledge_base.pdf
  chroma_persist_dir: .chroma_db
  collection_name: ai_ethics_kb
  chunk_size: 800
  chunk_overlap: 100
  top_k: 5
  embedding_model: all-MiniLM-L6-v2

scan:
  output_dir: compliance-analysis
  max_file_size_mb: 50

filesystem:
  write_lock_timeout_s: 30
  read_retry_attempts: 3
  read_retry_min_wait_s: 0.5
  read_retry_max_wait_s: 4.0

checkpoint:
  backend: sqlite
  sqlite_path: .langgraph_checkpoints.db
  postgres_uri_env: POSTGRES_URI

langsmith:
  project: ai-ethics-compliance-agent
  endpoint: https://api.smith.langchain.com
  tracing_v2: true

extension:
  debounce_ms: 5000
