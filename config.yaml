llm:
  default_provider: openrouter
  default_model: nvidia/nemotron-3-super-120b-a12b:free
  max_retries: 3
  retry_backoff_jitter: true
  rate_limit_rps: 2
  rate_limit_burst: 10
  providers:
    ollama_cloud:
      base_url: https://ollama.com
      models:
        - glm4:cloud
        - llama3.3:cloud
        - qwen2.5:cloud
    openrouter:
      base_url: https://openrouter.ai/api/v1
      models:
        - nvidia/nemotron-3-super-120b-a12b:free
    groq:
      models:
        - llama-3.3-70b-versatile
        - mixtral-8x7b-32768
        - gemma2-9b-it
    ollama_local:
      base_url: http://localhost:11434
      models: []

rag:
  knowledge_base_pdf: knowledge/ai_ethics_knowledge_base.pdf
  chroma_persist_dir: .chroma_db
  collection_name: ai_ethics_kb
  chunk_size: 500
  chunk_overlap: 50
  top_k: 3
  embedding_model: all-MiniLM-L6-v2

agentic:
  enabled: true
  runtime_mode: hybrid
  max_retries: 2
  retrieval_top_k: 3
  retrieval_trust_min: 0.3
  web_search_max_results: 3
  grade_thresholds:
    relevancy_min: 0.55
    faithfulness_min: 0.6
    context_quality_min: 0.5
    force_web_search_relevancy_max: 0.35

scan:
  output_dir: compliance-analysis
  max_file_size_mb: 50

directory_analysis:
  enabled: true
  filename: DIRECTORY_ANALYSIS.md
  preview_chars: 12000
  exclude_dirs:
    - .git
    - .hg
    - .svn
    - .venv
    - venv
    - env
    - node_modules
    - __pycache__
    - .mypy_cache
    - .pytest_cache
    - .ruff_cache
    - .tox
    - .idea
    - .vscode
    - .chroma_db
    - dist
    - build
  exclude_globs:
    - .env
    - .env.*
    - '*.pyc'
    - '*.pyo'
    - '*.so'
    - '*.dylib'
    - '*.dll'
    - '*.class'
    - '*.jar'
    - '*.whl'
    - '*.zip'
    - '*.tar'
    - '*.gz'
    - '*.7z'
    - '*.lock'
    - .DS_Store

filesystem:
  write_lock_timeout_s: 30
  read_retry_attempts: 3
  read_retry_min_wait_s: 0.5
  read_retry_max_wait_s: 4.0

checkpoint:
  backend: sqlite
  sqlite_path: .langgraph_checkpoints.db
  postgres_uri_env: POSTGRES_URI

langsmith:
  project: ai-ethics-compliance-agent
  endpoint: https://api.smith.langchain.com
  tracing_v2: true

extension:
  debounce_ms: 5000
